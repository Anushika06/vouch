name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      VOUCH_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
      - run: uv sync --frozen --extra mcp
      - name: Lint
        run: uv run ruff check .
      - name: Tests (deterministic mock models, no API keys)
        run: uv run pytest -q
      - name: Eval harness smoke (mock)
        run: uv run python -m evals.run --config naive,vouch-full --runs 1 --no-day --out /tmp/eval-mock

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Key-pattern check
        run: python scripts/check_secrets.py
