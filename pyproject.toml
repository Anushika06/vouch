[project]
name = "vouch"
version = "0.1.0"
description = "A personal AI assistant that knows where every memory came from."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "openai>=1.40",
  "tavily-python>=0.5",
  "dulwich>=0.22",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "pyyaml>=6",
  "tldextract>=5",
  "beautifulsoup4>=4.12",
  "python-multipart>=0.0.9",
  "cryptography>=50.0.2",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
vouch = "vouch.api.main:run"
vouch-mcp = "vouch.mcp_server.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vouch"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["web", "video"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
